name: Build D2 data
on:
  schedule:
    - cron: '41 17 * * *'   # 40 minutes after the Destiny 2 daily reset (17:00 UTC)
    - cron: '23 5 * * *'    # second check for hotfixes
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if the manifest version did not change
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build
        env:
          BUNGIE_API_KEY: ${{ secrets.BUNGIE_API_KEY }}
          FORCE: ${{ inputs.force && '1' || '' }}
        run: node --max-old-space-size=4096 scripts/build.js
      - name: Commit and refresh CDN
        run: |
          if git diff --quiet -- data; then echo "No changes"; exit 0; fi
          git config user.name "ranksurge-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git commit -m "Data: $(node -p "require('./data/meta.json').v")"
          git push
          for f in meta weapons armor perks sets groups curated; do
            curl -fsS "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/data/$f.json" > /dev/null || true
          done
